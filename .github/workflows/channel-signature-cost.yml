name: Channel signature cost

on:
  pull_request:
    paths:
      - .github/workflows/channel-signature-cost.yml

permissions:
  contents: read

jobs:
  measure:
    name: Channel signature cost (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
      - name: Measure actual Desktop channel reader
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 https://releases.dinkster.org/channels/stable.json -o "$RUNNER_TEMP/channel-cost-input.json"
          export CHANNEL_COST_INPUT="$RUNNER_TEMP/channel-cost-input.json"
          node --input-type=module <<'JS'
          import { createHash, generateKeyPairSync, sign } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { cpus, platform, release } from 'node:os'
          import { performance } from 'node:perf_hooks'
          import { verifyChannel } from './packages/desktop/src/channel-signatures.ts'

          function canonical(value) {
            if (Array.isArray(value)) return `[${value.map(canonical).join(',')}]`
            if (value !== null && typeof value === 'object') return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}`
            return JSON.stringify(value).replace(/[\u007f-\uffff]/g, character => `\\u${character.charCodeAt(0).toString(16).padStart(4, '0')}`)
          }
          const document = JSON.parse(readFileSync(process.env.CHANNEL_COST_INPUT, 'utf8'))
          const payload = { ...(document.signed ?? document), channel: 'nightly' }
          delete payload.signature
          const key = generateKeyPairSync('ed25519')
          const publicBytes = key.publicKey.export({ format: 'der', type: 'spki' }).subarray(-32)
          const keyId = `sha256:${createHash('sha256').update(publicBytes).digest('hex')}`
          const keys = { [keyId]: publicBytes.toString('base64') }
          const envelope = canonical({ signed: payload, signatures: [{ keyId, signature: sign(null, Buffer.from(canonical(payload)), key.privateKey).toString('base64') }] })
          if (verifyChannel(envelope, 'nightly', keys).channel !== 'nightly') throw Error('valid signature control failed')
          for (const [text, channel] of [[envelope, 'stable'], [envelope.replace('"nightly"', '"stable"'), 'stable']]) {
            let refused = false
            try { verifyChannel(text, channel, keys) } catch { refused = true }
            if (!refused) throw Error('signature refusal control failed')
          }
          for (let i = 0; i < 100; i++) verifyChannel(envelope, 'nightly', keys)
          const batches = []
          for (let batch = 0; batch < 7; batch++) {
            const start = performance.now()
            for (let i = 0; i < 10000; i++) verifyChannel(envelope, 'nightly', keys)
            batches.push((performance.now() - start) / 10000)
          }
          console.log(JSON.stringify({ head: process.env.SOURCE_HEAD, os: `${platform()} ${release()}`, cpu: cpus()[0].model, node: process.version,
            envelope_bytes: Buffer.byteLength(envelope), warmups: 100, batches: 7, checks_per_batch: 10000,
            verifyChannel_full_reader: { median_ms: [...batches].sort((a,b) => a-b)[3], slowest_batch_mean_ms: Math.max(...batches), batch_means_ms: batches },
          }, null, 2))
          JS
