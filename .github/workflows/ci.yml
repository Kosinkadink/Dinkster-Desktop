name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    secrets:
      DINKSTER_FRONTEND_READ_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DINKSTER_FRONTEND_REF: 0cfe50b6b34e661584c9f4b227846476e70cc709

jobs:
  frontend-access:
    name: frontend checkout availability
    runs-on: ${{ fromJSON(vars.DINKSTER_PR_RUNNER || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 2
    outputs:
      available: ${{ steps.availability.outputs.available }}
    steps:
      - id: availability
        env:
          FRONTEND_READ_TOKEN: ${{ secrets.DINKSTER_FRONTEND_READ_TOKEN }}
        run: |
          if [ -n "$FRONTEND_READ_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    name: types, unit tests and Linux build
    needs: frontend-access
    if: needs.frontend-access.outputs.available == 'true'
    runs-on: ${{ fromJSON(vars.DINKSTER_PR_RUNNER || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
          token: ${{ secrets.DINKSTER_FRONTEND_READ_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .frontend/pnpm-lock.yaml
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
