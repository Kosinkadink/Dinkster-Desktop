name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DINKSTER_FRONTEND_REF: fa99988eb5fcbf645fbcf7ead85a523b650de660

jobs:
  test:
    name: format, types, unit tests and Linux build
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .frontend/pnpm-lock.yaml
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  pr-status:
    name: pull request validation status
    if: always()
    needs: [test]
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 2
    steps:
      - name: Require the validation result
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
