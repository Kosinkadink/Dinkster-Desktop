name: Full validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '31 11 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  DINKSTER_FRONTEND_REF: 08deab9ce537bc8d567cd96ad4a11e014a33d2ff

jobs:
  linux:
    name: format, types, unit tests and Linux build
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .frontend/pnpm-lock.yaml
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop-smoke:
    name: packaged Linux Desktop startup
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .frontend/pnpm-lock.yaml
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: xvfb-run --auto-servernum node packages/e2e/scripts/verify-environment-client.mjs
      - run: pnpm --filter @dinkster/desktop exec electron-builder --linux --dir --config electron-builder.smoke.mjs --publish never
      - run: mkdir -p test-results/desktop-smoke && xvfb-run --auto-servernum node packages/e2e/scripts/verify-desktop-install.mjs
        env:
          DINKSTER_DESKTOP_EXECUTABLE: packages/desktop/release/linux-unpacked/dinkster-desktop-smoke
          DINKSTER_DESKTOP_VERIFY_ROOT: test-results/desktop-smoke/installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: |
            test-results/desktop-smoke/**/*.png
            test-results/desktop-smoke/**/*.json
          retention-days: 7

  windows-package:
    name: Windows package and update feed
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).windows }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .frontend/pnpm-lock.yaml
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @dinkster/desktop package:win
      - run: pnpm --filter @dinkster/desktop verify:update-feed
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packages/desktop/release/*-Setup.exe
          retention-days: 1
          if-no-files-found: error

  windows-installed:
    name: Windows installed app without Git
    needs: windows-package
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).windows }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Install into an isolated directory
        id: install
        run: |
          $installer = Get-Item installer/*-Setup.exe
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          if (Test-Path $destination) { throw 'Installation directory must be fresh' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          "DINKSTER_DESKTOP_EXECUTABLE=$(Join-Path $destination 'Dinkster Desktop.exe')" >> $env:GITHUB_ENV
          "DINKSTER_DESKTOP_VERIFY_ROOT=$(Join-Path $env:RUNNER_TEMP dinkster-first-run)" >> $env:GITHUB_ENV
      - run: pnpm --filter @dinkster/desktop verify:installed
        env:
          DINKSTER_ACCELERATOR: cpu
      - name: Preserve installed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-app
          path: |
            ${{ runner.temp }}/dinkster-first-run/*.png
            ${{ runner.temp }}/dinkster-first-run/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the owned installation
        if: always() && steps.install.outcome == 'success'
        run: |
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          $uninstaller = Join-Path $destination 'Uninstall Dinkster Desktop.exe'
          if (Test-Path $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList @('/S', '/currentuser') -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstaller exited $($process.ExitCode)" }
          }

  main-status:
    name: main validation status
    if: always()
    needs: [linux, desktop-smoke, windows-package, windows-installed]
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 2
    steps:
      - name: Record every lane result
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          SMOKE_RESULT: ${{ needs.desktop-smoke.result }}
          WINDOWS_RESULT: ${{ needs.windows-package.result }}
          INSTALLED_RESULT: ${{ needs.windows-installed.result }}
        run: |
          printf '{"commit":"%s","lanes":{"linux":"%s","desktop-smoke":"%s","windows-package":"%s","windows-installed":"%s"}}\n' \
            "$GITHUB_SHA" "$LINUX_RESULT" "$SMOKE_RESULT" "$WINDOWS_RESULT" "$INSTALLED_RESULT" > main-validation-status.json
          cat main-validation-status.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-validation-status
          path: main-validation-status.json
          retention-days: 30
          if-no-files-found: error
      - name: Require every lane to pass
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          SMOKE_RESULT: ${{ needs.desktop-smoke.result }}
          WINDOWS_RESULT: ${{ needs.windows-package.result }}
          INSTALLED_RESULT: ${{ needs.windows-installed.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$INSTALLED_RESULT" = success
