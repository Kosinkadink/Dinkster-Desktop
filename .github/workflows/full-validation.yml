name: Full validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - 'packages/desktop/src/**'
      - 'packages/desktop/resources/**'
      - 'packages/desktop/scripts/**'
      - 'packages/desktop/electron-builder*.mjs'
      - 'packages/desktop/package.json'
      - 'packages/e2e/scripts/verify-environment-client.mjs'
      - 'packages/e2e/scripts/verify-library-restore.mjs'
      - 'packages/e2e/scripts/restore-command.cjs'
      - 'packages/e2e/scripts/verify-desktop-install.mjs'
      - 'packages/e2e/scripts/verify-development-project.mjs'
      - 'packages/e2e/scripts/verify-services.mjs'
      - 'packages/e2e/scripts/verify-stable-project.mjs'
      - 'packages/e2e/scripts/forward-mirror.mjs'
      - 'packages/e2e/scripts/verify-shell-update.mjs'
      - 'packages/e2e/scripts/advance-update-installer.ps1'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select Desktop acceptance checks
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      installers: ${{ steps.paths.outputs.installers }}
      smoke: ${{ steps.paths.outputs.smoke }}
      development: ${{ steps.paths.outputs.development }}
      stable: ${{ steps.paths.outputs.stable }}
      updater: ${{ steps.paths.outputs.updater }}
      windows: ${{ steps.paths.outputs.windows }}
      services: ${{ steps.paths.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select checks from changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          installers=false smoke=false development=false stable=false updater=false services=false
          if [ "$EVENT" != pull_request ]; then
            installers=true smoke=true development=true
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}"; then
            git diff --name-only "$BASE" "$HEAD" > "$RUNNER_TEMP/desktop-changed-paths"
          else
            git ls-files > "$RUNNER_TEMP/desktop-changed-paths"
          fi
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|pnpm-lock.yaml|package.json|pnpm-workspace.yaml)
                installers=true smoke=true development=true stable=true ;;
              packages/desktop/src/*|packages/desktop/resources/*|packages/desktop/package.json)
                stable=true ;;
            esac
            case "$path" in
              packages/desktop/scripts/*|packages/desktop/electron-builder*.mjs|packages/desktop/src/environment-tools-release.json|scripts/*)
                installers=true ;;
            esac
            case "$path" in
              packages/desktop/src/release.ts|packages/desktop/src/backend-release.json|packages/desktop/src/engine.ts|packages/desktop/src/library.ts|packages/desktop/src/main.ts|packages/desktop/src/preload.ts|packages/e2e/scripts/verify-desktop-install.mjs|packages/e2e/scripts/verify-environment-client.mjs|packages/e2e/scripts/verify-library-restore.mjs|packages/e2e/scripts/restore-command.cjs)
                smoke=true ;;
            esac
            case "$path" in
              packages/desktop/src/environment.ts|packages/desktop/src/environment-tools-release.json|packages/desktop/src/main.ts|packages/desktop/src/project-dialog.ts|packages/desktop/src/projects.ts|packages/desktop/src/window-chrome.ts|packages/desktop/resources/projects.html|packages/e2e/scripts/verify-development-project.mjs)
                development=true ;;
            esac
            case "$path" in
              packages/e2e/scripts/verify-stable-project.mjs|packages/e2e/scripts/forward-mirror.mjs)
                stable=true ;;
            esac
            case "$path" in
              .github/workflows/windows-update.yml|.github/workflows/full-validation.yml|pnpm-lock.yaml|package.json|pnpm-workspace.yaml|packages/desktop/src/shell-updater.ts|packages/desktop/src/update-feed.ts|packages/desktop/package.json|packages/desktop/electron-builder*.mjs|packages/desktop/scripts/verify-update-feed.mjs|packages/e2e/scripts/verify-shell-update.mjs|packages/e2e/scripts/advance-update-installer.ps1)
                updater=true ;;
            esac
            case "$path" in
              .github/workflows/verify-services.yml|packages/desktop/src/*|packages/e2e/scripts/verify-services.mjs|scripts/frontend-release.json)
                if [ "$EVENT" = pull_request ]; then services=true; fi ;;
            esac
          done < "$RUNNER_TEMP/desktop-changed-paths"
          if [ "$EVENT" != pull_request ]; then stable=false; fi
          windows=false
          if $installers || $smoke || $development || $stable || $services; then windows=true; fi
          for key in installers smoke development stable updater windows services; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_OUTPUT"
          done

  installers:
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    uses: ./.github/workflows/release-desktop.yml
    with:
      source: ${{ github.event.pull_request.head.sha || github.sha }}

  desktop-smoke:
    name: packaged Linux Desktop startup
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @dinkster/desktop prepare:tools
      - run: pnpm --filter @dinkster/desktop exec electron-builder --linux --dir --config electron-builder.smoke.mjs --publish never
      - run: node packages/desktop/scripts/verify-installed-tools.mjs packages/desktop/release/linux-unpacked/resources
      - run: xvfb-run --auto-servernum node packages/e2e/scripts/verify-environment-client.mjs
        env:
          DINKSTER_ELECTRON_EXECUTABLE: packages/desktop/release/linux-unpacked/dinkster-desktop-smoke
      - run: xvfb-run --auto-servernum node packages/e2e/scripts/verify-library-restore.mjs
        env:
          DINKSTER_RESTORE_UI: '1'
          DINKSTER_SMOKE_ARTIFACTS: test-results/desktop-smoke/library-restore
      - run: mkdir -p test-results/desktop-smoke && xvfb-run --auto-servernum node packages/e2e/scripts/verify-desktop-install.mjs
        env:
          DINKSTER_DESKTOP_EXECUTABLE: packages/desktop/release/linux-unpacked/dinkster-desktop-smoke
          DINKSTER_DESKTOP_VERIFY_ROOT: test-results/desktop-smoke/installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: |
            test-results/desktop-smoke/**/*.png
            test-results/desktop-smoke/**/*.json
          retention-days: 7

  windows-package:
    name: Windows package and update feed
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).windows }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @dinkster/desktop package:win
      - run: pnpm --filter @dinkster/desktop verify:update-feed
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packages/desktop/release/*-Setup.exe
          retention-days: 1
          if-no-files-found: error

  windows-installed:
    name: Windows installed app without Git
    needs: windows-package
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).windows }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Install into an isolated directory
        id: install
        run: |
          $installer = Get-Item installer/*-Setup.exe
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          if (Test-Path $destination) { throw 'Installation directory must be fresh' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          "DINKSTER_DESKTOP_EXECUTABLE=$(Join-Path $destination 'Dinkster Desktop.exe')" >> $env:GITHUB_ENV
          "DINKSTER_DESKTOP_VERIFY_ROOT=$(Join-Path $env:RUNNER_TEMP dinkster-first-run)" >> $env:GITHUB_ENV
      - name: Verify installed tools
        run: |
          node packages/desktop/scripts/verify-installed-tools.mjs (Join-Path $env:RUNNER_TEMP 'dinkster-installed/resources')
          if ($LASTEXITCODE -ne 0) { throw 'Installed tools verification failed' }
      - run: pnpm --filter @dinkster/desktop verify:installed
        env:
          DINKSTER_ACCELERATOR: cpu
      - name: Verify installed MXC resources
        run: |
          node packages/desktop/scripts/verify-installed-mxc.mjs (Join-Path $env:RUNNER_TEMP 'dinkster-installed/resources') > (Join-Path $env:DINKSTER_DESKTOP_VERIFY_ROOT 'installed-mxc.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed MXC verification failed' }
      - name: Preserve installed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-app
          path: |
            ${{ runner.temp }}/dinkster-first-run/*.png
            ${{ runner.temp }}/dinkster-first-run/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the owned installation
        if: always() && steps.install.outcome == 'success'
        run: |
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          $uninstaller = Join-Path $destination 'Uninstall Dinkster Desktop.exe'
          if (Test-Path $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList @('/S', '/currentuser') -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstaller exited $($process.ExitCode)" }
          }

  development:
    needs: [changes, windows-package]
    if: needs.changes.outputs.development == 'true'
    uses: ./.github/workflows/development-project.yml

  services:
    needs: [changes, windows-package]
    if: needs.changes.outputs.services == 'true'
    uses: ./.github/workflows/verify-services.yml

  stable-project:
    needs: [changes, windows-package]
    if: needs.changes.outputs.stable == 'true'
    uses: ./.github/workflows/verify-stable-project.yml
    with:
      shared_installer: true

  updater:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.updater == 'true'
    uses: ./.github/workflows/windows-update.yml
