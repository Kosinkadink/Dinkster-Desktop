name: Private Windows Desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-desktop-release
  cancel-in-progress: false

jobs:
  validation:
    if: github.repository == 'Kosinkadink/Dinkster-Frontend' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/full-validation.yml
    secrets: inherit

  release:
    needs: validation
    if: github.repository == 'Kosinkadink/Dinkster-Frontend' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Download pinned private backend and Aimdo
        env:
          GH_TOKEN: ${{ secrets.DINKSTER_RELEASE_READ_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'Configure DINKSTER_RELEASE_READ_TOKEN with read access to private Kosinkadink/Dinkster and Kosinkadink/dinkster-aimdo releases' }
          $pin = Get-Content packages/desktop/src/backend-release.json -Raw | ConvertFrom-Json
          if ($pin.repository -ne 'Kosinkadink/Dinkster' -or $pin.commit -notmatch '^[a-f0-9]{40}$') { throw 'Invalid backend pin' }
          if ($pin.releaseTag -ne "backend-$($pin.commit)") { throw 'Invalid backend release tag' }
          $repo = gh api repos/Kosinkadink/Dinkster | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $repo.private) { throw 'Backend release repository must be private' }
          $destination = Join-Path $env:RUNNER_TEMP backend-artifact
          gh release download $pin.releaseTag --repo Kosinkadink/Dinkster --pattern $pin.archive --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Pinned backend release download failed' }
          "DINKSTER_ENGINE_ARCHIVE=$(Join-Path $destination $pin.archive)" >> $env:GITHUB_ENV
          $aimdo = $pin.desktopWindowsRuntime.aimdo
          if ($aimdo.repository -ne 'Kosinkadink/dinkster-aimdo' -or $aimdo.releaseTag -ne "v$($aimdo.version)") { throw 'Invalid Aimdo pin' }
          $repo = gh api repos/Kosinkadink/dinkster-aimdo | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $repo.private) { throw 'Aimdo release repository must be private' }
          gh release download $aimdo.releaseTag --repo Kosinkadink/dinkster-aimdo --pattern $aimdo.archive --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Aimdo wheel download failed' }
          "DINKSTER_AIMDO_WHEEL=$(Join-Path $destination $aimdo.archive)" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          NODE_OPTIONS: --max-semi-space-size=64
          npm_config_workspace_concurrency: '1'
      - run: pnpm --filter @dinkster/e2e exec playwright install chromium
      - run: pnpm --filter @dinkster/e2e exec playwright test --config=playwright.audit-assets.config.ts
        env:
          DINKSTER_E2E_PORT: "15376"
      - run: pnpm --filter @dinkster/desktop package:win
      - run: pnpm --filter @dinkster/desktop verify:update-feed
      - name: Install into an isolated directory
        run: |
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          "DINKSTER_DESKTOP_EXECUTABLE=$(Join-Path $destination 'Dinkster Desktop.exe')" >> $env:GITHUB_ENV
          "DINKSTER_DESKTOP_VERIFY_ROOT=$(Join-Path $env:RUNNER_TEMP dinkster-first-run)" >> $env:GITHUB_ENV
      - run: pnpm --filter @dinkster/desktop verify:installed
      - name: Preserve private verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-install-verification
          path: |
            ${{ runner.temp }}/dinkster-first-run/*.png
            ${{ runner.temp }}/dinkster-first-run/*.json
          if-no-files-found: ignore
      - name: Record source and artifact checksums
        run: |
          $package = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
          $pin = Get-Content packages/desktop/src/backend-release.json -Raw | ConvertFrom-Json
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          @{ repository = 'Kosinkadink/Dinkster-Frontend'; commit = $env:GITHUB_SHA; version = $package.version; backend = $pin; archive = $installer.Name; sha256 = $hash; size = $installer.Length } | ConvertTo-Json -Depth 8 | Set-Content packages/desktop/release/desktop-release.json
          "$hash  $($installer.Name)" | Set-Content packages/desktop/release/SHA256SUMS
          "DESKTOP_TAG=desktop-v$($package.version)" >> $env:GITHUB_ENV
      - name: Create private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = gh api repos/Kosinkadink/Dinkster-Frontend | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $repo.private) { throw 'Desktop release repository must remain private' }
          $tags = gh api "repos/Kosinkadink/Dinkster-Frontend/git/matching-refs/tags/$env:DESKTOP_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release tag availability' }
          if (@($tags | Where-Object { $_.ref -ceq "refs/tags/$env:DESKTOP_TAG" }).Count -ne 0) { throw 'Desktop version tag already exists; bump the package version' }
          gh release create $env:DESKTOP_TAG packages/desktop/release/*-Setup.exe packages/desktop/release/desktop-release.json packages/desktop/release/SHA256SUMS --repo Kosinkadink/Dinkster-Frontend --target $env:GITHUB_SHA --title "Dinkster Desktop $env:DESKTOP_TAG" --notes 'Unsigned Windows x64 installer. Source commits and SHA256 are in desktop-release.json. Requires internet for locked first-run dependencies. See docs/desktop.md at the release commit.'
          if ($LASTEXITCODE -ne 0) { throw 'Private release creation failed; existing versions are never overwritten' }
