name: Private Windows Desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DINKSTER_FRONTEND_REF: 0cfe50b6b34e661584c9f4b227846476e70cc709
  DINKSTER_REF: c4d9e9375bb8ff52cb3480666c208856fea22477
  DINKSTER_CONTROL_RUNTIME_DESCRIPTOR_SHA256: 41be0dc1ffd778bd18b95bb0d91208b5eec38e04d5957cde56f94107915cb9ce
  DINKSTER_CONTROL_RUNTIME_ARCHIVE_SHA256: 77d6875fa3cd5790beb67cd2a36e2f96823274603530ce488294001ebe1deea8
  DINKSTER_CONTROL_RUNTIME_ARCHIVE_SIZE: '24812249'

concurrency:
  group: private-desktop-release
  cancel-in-progress: false

jobs:
  validation:
    if: github.repository == 'Kosinkadink/Dinkster-Desktop' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: validation
    if: github.repository == 'Kosinkadink/Dinkster-Desktop' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
          token: ${{ secrets.DINKSTER_FRONTEND_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .dinkster
          token: ${{ secrets.DINKSTER_RELEASE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v5
      - name: Build and verify the pinned Windows control runtime
        run: |
          uv sync --project .dinkster --frozen
          $feed = Join-Path $env:RUNNER_TEMP control-runtime-feed
          Push-Location .dinkster
          try {
            $env:PYTHONPATH = (Get-Location).Path
            uv run --no-sync python scripts/build_engine_feed.py --feed $feed --cells win-cu128 --control-runtime
          } finally {
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            Pop-Location
          }
          $descriptor = Join-Path $feed "control/$env:DINKSTER_REF/windows-amd64.json"
          if ((Get-FileHash $descriptor -Algorithm SHA256).Hash.ToLower() -cne $env:DINKSTER_CONTROL_RUNTIME_DESCRIPTOR_SHA256) {
            throw 'Generated control-runtime descriptor does not match the pinned descriptor'
          }
          $body = Get-Content $descriptor -Raw | ConvertFrom-Json
          $archive = Join-Path $feed $body.artifact.path
          if ($body.commit -cne $env:DINKSTER_REF -or $body.platform -cne 'windows-amd64' -or
              $body.artifact.sha256 -cne $env:DINKSTER_CONTROL_RUNTIME_ARCHIVE_SHA256 -or
              $body.artifact.size -ne [long]$env:DINKSTER_CONTROL_RUNTIME_ARCHIVE_SIZE -or
              (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -cne $env:DINKSTER_CONTROL_RUNTIME_ARCHIVE_SHA256 -or
              (Get-Item $archive).Length -ne [long]$env:DINKSTER_CONTROL_RUNTIME_ARCHIVE_SIZE) {
            throw 'Generated control-runtime archive does not match the pinned artifact'
          }
          "DINKSTER_CONTROL_RUNTIME_DESCRIPTOR=$descriptor" >> $env:GITHUB_ENV
          "DINKSTER_CONTROL_RUNTIME_ARCHIVE=$archive" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          NODE_OPTIONS: --max-semi-space-size=64
          npm_config_workspace_concurrency: '1'
      - run: pnpm --filter @dinkster/e2e exec playwright install chromium
      - run: pnpm --filter @dinkster/e2e exec playwright test --config=playwright.audit-assets.config.ts
        env:
          DINKSTER_E2E_PORT: "15376"
      - run: pnpm --filter @dinkster/desktop package:win
      - run: pnpm --filter @dinkster/desktop verify:update-feed
      - name: Install into an isolated directory
        run: |
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          "DINKSTER_DESKTOP_EXECUTABLE=$(Join-Path $destination 'Dinkster Desktop.exe')" >> $env:GITHUB_ENV
          "DINKSTER_DESKTOP_VERIFY_ROOT=$(Join-Path $env:RUNNER_TEMP dinkster-first-run)" >> $env:GITHUB_ENV
      - run: pnpm --filter @dinkster/desktop verify:installed
      - name: Preserve private verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-install-verification
          path: |
            ${{ runner.temp }}/dinkster-first-run/*.png
            ${{ runner.temp }}/dinkster-first-run/*.json
          if-no-files-found: ignore
      - name: Record source and artifact checksums
        run: |
          $package = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $controlRuntime = Get-Content $env:DINKSTER_CONTROL_RUNTIME_DESCRIPTOR -Raw | ConvertFrom-Json
          @{ repository = 'Kosinkadink/Dinkster-Desktop'; commit = $env:GITHUB_SHA; version = $package.version; controlRuntime = $controlRuntime; archive = $installer.Name; sha256 = $hash; size = $installer.Length } | ConvertTo-Json -Depth 8 | Set-Content packages/desktop/release/desktop-release.json
          "$hash  $($installer.Name)" | Set-Content packages/desktop/release/SHA256SUMS
          "DESKTOP_TAG=desktop-v$($package.version)" >> $env:GITHUB_ENV
      - name: Create private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = gh api repos/Kosinkadink/Dinkster-Desktop | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $repo.private) { throw 'Desktop release repository must remain private' }
          $tags = gh api "repos/Kosinkadink/Dinkster-Desktop/git/matching-refs/tags/$env:DESKTOP_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release tag availability' }
          if (@($tags | Where-Object { $_.ref -ceq "refs/tags/$env:DESKTOP_TAG" }).Count -ne 0) { throw 'Desktop version tag already exists; bump the package version' }
          gh release create $env:DESKTOP_TAG packages/desktop/release/*-Setup.exe packages/desktop/release/desktop-release.json packages/desktop/release/SHA256SUMS --repo Kosinkadink/Dinkster-Desktop --target $env:GITHUB_SHA --title "Dinkster Desktop $env:DESKTOP_TAG" --notes 'Unsigned Windows x64 installer. Source commits and SHA256 are in desktop-release.json. Requires internet for locked first-run dependencies. See README.md at the release commit.'
          if ($LASTEXITCODE -ne 0) { throw 'Private release creation failed; existing versions are never overwritten' }
