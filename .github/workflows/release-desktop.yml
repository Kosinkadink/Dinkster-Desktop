name: Desktop installer builds

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release-desktop.yml'
      - '.github/workflows/publish-desktop.yml'
      - 'packages/desktop/scripts/prepare-tools.mjs'
      - 'packages/desktop/scripts/verify-installed-tools.mjs'
      - 'packages/desktop/src/environment-tools-release.json'
      - 'packages/desktop/package.json'
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      signed:
        type: boolean
        default: false

permissions:
  contents: read

env:
  DINKSTER_FRONTEND_REF: 734c32da1360c6a1496d37fb9373f87209a1a27f
  DESKTOP_SOURCE_COMMIT: ${{ inputs.source || github.sha }}

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ inputs.source || github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Apple Silicon installer
    runs-on: macos-latest
    environment: ${{ inputs.signed && 'desktop-signing' || '' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .frontend/pnpm-lock.yaml
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - if: ${{ !inputs.signed }}
        run: pnpm --filter @dinkster/desktop package:mac
      - name: Sign and notarize the release app
        if: inputs.signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @dinkster/desktop package:mac:signed
      - run: pnpm --filter @dinkster/desktop verify:update-feed
      - name: Verify the extracted Apple Silicon app
        working-directory: packages/desktop/release
        run: |
          test "$(uname -m)" = arm64
          archives=(Dinkster-Desktop-*-macos-arm64.zip)
          test "${#archives[@]}" = 1
          ditto -x -k "${archives[0]}" "$RUNNER_TEMP/dinkster-macos-installed"
          executable="$RUNNER_TEMP/dinkster-macos-installed/Dinkster Desktop.app/Contents/MacOS/Dinkster Desktop"
          test -x "$executable"
          test "$(lipo -archs "$executable")" = arm64
          node ../scripts/verify-installed-tools.mjs "$RUNNER_TEMP/dinkster-macos-installed/Dinkster Desktop.app/Contents/Resources" > installed-tools.json
          shasum -a 256 "${archives[0]}" > installer-SHA256SUMS
      - name: Verify Developer ID and notarization on the release app
        if: inputs.signed
        run: |
          app="$RUNNER_TEMP/dinkster-macos-installed/Dinkster Desktop.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Record source and artifact identity
        working-directory: packages/desktop
        env:
          SIGNED_RELEASE: ${{ inputs.signed || false }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const archive = readdirSync('release').find(name => name.endsWith('-macos-arm64.zip'));
          const sha256 = readFileSync('release/installer-SHA256SUMS', 'utf8').split(/\s+/)[0];
          writeFileSync('release/desktop-macos-release.json', JSON.stringify({
            repository: 'Kosinkadink/Dinkster-Desktop', commit: process.env.DESKTOP_SOURCE_COMMIT,
            frontend: process.env.DINKSTER_FRONTEND_REF, version: pkg.version,
            platform: { os: 'macos', arch: 'arm64' },
            signed: process.env.SIGNED_RELEASE === 'true', notarized: process.env.SIGNED_RELEASE === 'true',
            archive, sha256, size: statSync(`release/${archive}`).size,
          }, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            packages/desktop/release/*-macos-arm64.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/*-mac.yml
            packages/desktop/release/desktop-macos-release.json
            packages/desktop/release/installer-SHA256SUMS
            packages/desktop/release/installed-tools.json
          retention-days: 14
          if-no-files-found: error

  installers:
    name: ${{ matrix.os }} installer resources
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[matrix.os] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .frontend/pnpm-lock.yaml
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'linux'
        run: pnpm --filter @dinkster/desktop package:linux
      - if: matrix.os == 'windows'
        run: pnpm --filter @dinkster/desktop package:win
      - name: Extract Linux installer and verify resources
        if: matrix.os == 'linux'
        working-directory: packages/desktop/release
        run: |
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
          node ../scripts/verify-installed-tools.mjs squashfs-root/resources > installed-tools.json
          sha256sum ./*.AppImage > installer-SHA256SUMS
      - name: Verify Linux update metadata and record artifact identity
        if: matrix.os == 'linux'
        working-directory: packages/desktop
        run: |
          node scripts/verify-update-feed.mjs
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const archive = readdirSync('release').find(name => name.endsWith('.AppImage'));
          const sha256 = readFileSync('release/installer-SHA256SUMS', 'utf8').split(/\s+/)[0];
          writeFileSync('release/desktop-linux-release.json', JSON.stringify({
            repository: 'Kosinkadink/Dinkster-Desktop', commit: process.env.DESKTOP_SOURCE_COMMIT,
            frontend: process.env.DINKSTER_FRONTEND_REF, version: pkg.version,
            platform: { os: 'linux', arch: 'x64' }, archive, sha256, size: statSync(`release/${archive}`).size,
          }, null, 2) + '\n');
          JS
      - name: Install Windows package and verify resources
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $destination = Join-Path $env:RUNNER_TEMP dinkster-tools-installed
          if (Test-Path $destination) { throw 'Installation directory already exists' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          node packages/desktop/scripts/verify-installed-tools.mjs (Join-Path $destination resources) > packages/desktop/release/installed-tools.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed tools verification failed' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" > packages/desktop/release/installer-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-installer
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*-linux.yml
            packages/desktop/release/desktop-linux-release.json
            packages/desktop/release/*-Setup.exe
            packages/desktop/release/installed-tools.json
            packages/desktop/release/installer-SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [macos, installers]
    if: github.repository == 'Kosinkadink/Dinkster-Desktop' && inputs.signed
    environment: desktop-signing
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).windows }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          NODE_OPTIONS: --max-semi-space-size=64
          npm_config_workspace_concurrency: '1'
      - name: Package and sign with Artifact Signing
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: pnpm --filter @dinkster/desktop package:win:signed
      - run: pnpm --filter @dinkster/desktop verify:update-feed
      - name: Verify publisher signatures
        run: |
          $expected = (node --input-type=module -e "import('./packages/desktop/electron-builder.signed.mjs').then((m) => process.stdout.write(m.currentPublisher))")
          if ($LASTEXITCODE -ne 0 -or !$expected) { throw 'Could not read the expected publisher' }
          $files = @(
            Get-ChildItem packages/desktop/release -Filter '*-Setup.exe'
            Get-Item 'packages/desktop/release/win-unpacked/Dinkster Desktop.exe'
          )
          if ($files.Count -ne 2) { throw 'Expected one installer and one application executable' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $subject = $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): signature status $($signature.Status)" }
            if (!$signature.TimeStamperCertificate) { throw "$($file.Name): signature is not timestamped" }
            if ($subject -notlike "CN=$expected,*") { throw "$($file.Name): unexpected publisher $subject" }
            $line = "$($file.Name): valid signature from $subject, timestamped by $($signature.TimeStamperCertificate.Subject)"
            Write-Host $line
            "- $line" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Install into an isolated directory
        run: |
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          "DINKSTER_DESKTOP_EXECUTABLE=$(Join-Path $destination 'Dinkster Desktop.exe')" >> $env:GITHUB_ENV
          "DINKSTER_DESKTOP_VERIFY_ROOT=$(Join-Path $env:RUNNER_TEMP dinkster-first-run)" >> $env:GITHUB_ENV
          node packages/desktop/scripts/verify-installed-tools.mjs (Join-Path $destination resources)
          if ($LASTEXITCODE -ne 0) { throw 'Installed tools verification failed' }
      - run: pnpm --filter @dinkster/desktop verify:installed
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-install-verification
          path: |
            ${{ runner.temp }}/dinkster-first-run/*.png
            ${{ runner.temp }}/dinkster-first-run/*.json
          if-no-files-found: ignore
      - name: Record source and artifact checksums
        run: |
          $package = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
          $pin = Get-Content packages/desktop/src/backend-release.json -Raw | ConvertFrom-Json
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          @{ repository = 'Kosinkadink/Dinkster-Desktop'; commit = $env:DESKTOP_SOURCE_COMMIT; version = $package.version; backend = $pin; archive = $installer.Name; sha256 = $hash; size = $installer.Length } | ConvertTo-Json -Depth 8 | Set-Content packages/desktop/release/desktop-release.json
          "$hash  $($installer.Name)" | Set-Content packages/desktop/release/SHA256SUMS
      - name: Keep the signed installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-signed-installer
          path: |
            packages/desktop/release/*-Setup.exe
            packages/desktop/release/desktop-release.json
            packages/desktop/release/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Acquire the verified signed Mac installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: packages/desktop/macos-release
      - name: Acquire the verified Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux-installer
          path: packages/desktop/linux-release
      - name: Verify the Mac installer belongs to this release
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/desktop/package.json', 'utf8'));
          const metadata = JSON.parse(readFileSync('packages/desktop/macos-release/desktop-macos-release.json', 'utf8'));
          assert.equal(metadata.repository, 'Kosinkadink/Dinkster-Desktop');
          assert.equal(metadata.commit, process.env.DESKTOP_SOURCE_COMMIT);
          assert.equal(metadata.version, pkg.version);
          assert.equal(metadata.frontend, process.env.DINKSTER_FRONTEND_REF);
          const name = `Dinkster-Desktop-${pkg.version}-macos-arm64.zip`;
          assert.equal(metadata.archive, name);
          assert.deepEqual(metadata.platform, { os: 'macos', arch: 'arm64' });
          assert.equal(metadata.signed, true);
          assert.equal(metadata.notarized, true);
          const bytes = readFileSync(`packages/desktop/macos-release/${name}`);
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          assert.equal(metadata.size, bytes.length);
          assert.equal(metadata.sha256, sha256);
          appendFileSync('packages/desktop/release/SHA256SUMS', `${sha256}  ${name}\n`);
          JS
      - name: Keep the complete verified release asset set
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-assets
          path: |
            packages/desktop/release/*-Setup.exe
            packages/desktop/release/desktop-release.json
            packages/desktop/release/SHA256SUMS
            packages/desktop/release/*.yml
            packages/desktop/release/*.blockmap
            packages/desktop/macos-release/*-macos-arm64.zip
            packages/desktop/macos-release/*-mac.yml
            packages/desktop/macos-release/*.blockmap
            packages/desktop/macos-release/desktop-macos-release.json
            packages/desktop/linux-release/*.AppImage
            packages/desktop/linux-release/*-linux.yml
            packages/desktop/linux-release/desktop-linux-release.json
          retention-days: 14
          if-no-files-found: error
