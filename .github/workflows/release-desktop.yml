name: Windows Desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DINKSTER_FRONTEND_REF: 54b24ecd8a7a7a079863cb751b14988f29047c46

concurrency:
  group: private-desktop-release
  cancel-in-progress: false

jobs:
  validation:
    if: github.repository == 'Kosinkadink/Dinkster-Desktop' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/full-validation.yml

  release:
    needs: validation
    if: github.repository == 'Kosinkadink/Dinkster-Desktop' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: desktop-signing
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).windows }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Validate version tag
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_REF -notmatch '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?$') {
            throw 'Expected vX.Y.Z or vX.Y.Z-test-suffix; refusing to sign an unrelated tag'
          }
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.DINKSTER_FRONTEND_REF }}
          path: .frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm --dir .frontend install --frozen-lockfile
      - run: pnpm --dir .frontend --filter @dinkster/app build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          NODE_OPTIONS: --max-semi-space-size=64
          npm_config_workspace_concurrency: '1'
      - name: Package and sign with Artifact Signing
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: pnpm --filter @dinkster/desktop package:win:signed
      - run: pnpm --filter @dinkster/desktop verify:update-feed
      - name: Verify publisher signatures
        run: |
          $expected = (node --input-type=module -e "import('./packages/desktop/electron-builder.signed.mjs').then((m) => process.stdout.write(m.currentPublisher))")
          if ($LASTEXITCODE -ne 0 -or !$expected) { throw 'Could not read the expected publisher' }
          $files = @(
            Get-ChildItem packages/desktop/release -Filter '*-Setup.exe'
            Get-Item 'packages/desktop/release/win-unpacked/Dinkster Desktop.exe'
          )
          if ($files.Count -ne 2) { throw 'Expected one installer and one application executable' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $subject = $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): signature status $($signature.Status)" }
            if (!$signature.TimeStamperCertificate) { throw "$($file.Name): signature is not timestamped" }
            if ($subject -notlike "CN=$expected,*") { throw "$($file.Name): unexpected publisher $subject" }
            $line = "$($file.Name): valid signature from $subject, timestamped by $($signature.TimeStamperCertificate.Subject)"
            Write-Host $line
            "- $line" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Install into an isolated directory
        run: |
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $destination = Join-Path $env:RUNNER_TEMP dinkster-installed
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          "DINKSTER_DESKTOP_EXECUTABLE=$(Join-Path $destination 'Dinkster Desktop.exe')" >> $env:GITHUB_ENV
          "DINKSTER_DESKTOP_VERIFY_ROOT=$(Join-Path $env:RUNNER_TEMP dinkster-first-run)" >> $env:GITHUB_ENV
      - run: pnpm --filter @dinkster/desktop verify:installed
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-install-verification
          path: |
            ${{ runner.temp }}/dinkster-first-run/*.png
            ${{ runner.temp }}/dinkster-first-run/*.json
          if-no-files-found: ignore
      - name: Record source and artifact checksums
        run: |
          $package = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
          $pin = Get-Content packages/desktop/src/backend-release.json -Raw | ConvertFrom-Json
          $installer = Get-Item packages/desktop/release/*-Setup.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          @{ repository = 'Kosinkadink/Dinkster-Desktop'; commit = $env:GITHUB_SHA; version = $package.version; backend = $pin; archive = $installer.Name; sha256 = $hash; size = $installer.Length } | ConvertTo-Json -Depth 8 | Set-Content packages/desktop/release/desktop-release.json
          "$hash  $($installer.Name)" | Set-Content packages/desktop/release/SHA256SUMS
          "DESKTOP_TAG=desktop-v$($package.version)" >> $env:GITHUB_ENV
      - name: Keep the signed installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-signed-installer
          path: |
            packages/desktop/release/*-Setup.exe
            packages/desktop/release/desktop-release.json
            packages/desktop/release/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Create release
        if: github.ref == 'refs/heads/main' || !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh api "repos/Kosinkadink/Dinkster-Desktop/git/matching-refs/tags/$env:DESKTOP_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release tag availability' }
          if (@($tags | Where-Object { $_.ref -ceq "refs/tags/$env:DESKTOP_TAG" }).Count -ne 0) { throw 'Desktop version tag already exists; bump the package version' }
          gh release create $env:DESKTOP_TAG packages/desktop/release/*-Setup.exe packages/desktop/release/desktop-release.json packages/desktop/release/SHA256SUMS --repo Kosinkadink/Dinkster-Desktop --target $env:GITHUB_SHA --title "Dinkster Desktop $env:DESKTOP_TAG" --notes 'Windows x64 installer signed through Artifact Signing. Source commits and SHA256 are in desktop-release.json. Requires internet for locked first-run dependencies. See README.md at the release commit.'
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing versions are never overwritten' }
