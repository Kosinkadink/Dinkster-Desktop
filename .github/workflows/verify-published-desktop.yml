name: Verify published Desktop

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      release_tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows:
    name: Published Windows - ${{ matrix.scenario }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [current, update, corruption, downgrade]
    defaults:
      run:
        shell: pwsh
    env:
      DINKSTER_ACCELERATOR: cpu
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
      - run: pnpm install --frozen-lockfile
      - name: Select disposable verification directory
        run: '"DINKSTER_VERIFY_WORK=$(Join-Path $env:RUNNER_TEMP published-update)" >> $env:GITHUB_ENV'
      - name: Acquire and verify immutable published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DESKTOP_SOURCE_COMMIT: ${{ inputs.source }}
        run: node packages/desktop/scripts/download-update-releases.mjs
      - name: Verify signatures and install without acquisition credentials
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          Get-ChildItem Env: | Where-Object { $_.Name -match 'TOKEN|SECRET|PASSWORD|CREDENTIAL|^GIT_' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $releases = Get-Content (Join-Path $env:DINKSTER_VERIFY_WORK releases.json) -Raw | ConvertFrom-Json
          foreach ($release in @($releases.current, $releases.previous) | Where-Object { $_ }) {
            $signature = Get-AuthenticodeSignature (Join-Path $release.directory $release.archive)
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=(Jedrzej Kosinski|Dinkster Inc)(,|$)') { throw 'Published installer signature/publisher invalid' }
          }
          if ($env:SCENARIO -ne 'current' -and -not $releases.previous) {
            'Bootstrap only: no older updater-capable release; signed cross-version acceptance remains OPEN.' >> $env:GITHUB_STEP_SUMMARY
            @{ bootstrap = $true; crossVersionProven = $false; scenario = $env:SCENARIO } | ConvertTo-Json | Set-Content (Join-Path $env:DINKSTER_VERIFY_WORK bootstrap.json)
            exit 0
          }
          $installed = if ($env:SCENARIO -in @('update', 'corruption')) { $releases.previous } else { $releases.current }
          $destination = Join-Path $env:RUNNER_TEMP 'installed/Dinkster Desktop'
          if (Test-Path $destination) { throw 'Installation must be fresh' }
          $process = Start-Process (Join-Path $installed.directory $installed.archive) -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $env:DINKSTER_DESKTOP_EXECUTABLE = Join-Path $destination 'Dinkster Desktop.exe'
          if ($env:SCENARIO -eq 'current') {
            $env:DINKSTER_DESKTOP_VERIFY_ROOT = Join-Path $env:DINKSTER_VERIFY_WORK 'default-feed'
            $env:DINKSTER_VERIFY_PUBLIC_UPDATE = '1'
            node packages/e2e/scripts/verify-desktop-install.mjs
          } else {
            $available = if ($env:SCENARIO -eq 'downgrade') { $releases.previous } else { $releases.current }
            $env:DINKSTER_UPDATE_OLD_EXECUTABLE = $env:DINKSTER_DESKTOP_EXECUTABLE
            $env:DINKSTER_UPDATE_RELEASE = $available.directory
            $env:DINKSTER_UPDATE_EXPECTED_VERSION = $available.version
            $env:DINKSTER_UPDATE_PROOF_ROOT = Join-Path $env:DINKSTER_VERIFY_WORK 'update-proof'
            $env:DINKSTER_UPDATE_CORRUPT = if ($env:SCENARIO -eq 'corruption') { '1' } else { '0' }
            $env:DINKSTER_UPDATE_EXPECT_UNAVAILABLE = if ($env:SCENARIO -eq 'downgrade') { '1' } else { '0' }
            node packages/e2e/scripts/verify-shell-update.mjs
          }
          if ($LASTEXITCODE -ne 0) { throw 'Published installed verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-windows-${{ matrix.scenario }}
          path: |
            ${{ env.DINKSTER_VERIFY_WORK }}/*.json
            ${{ env.DINKSTER_VERIFY_WORK }}/default-feed/*.json
            ${{ env.DINKSTER_VERIFY_WORK }}/default-feed/*.png
            ${{ env.DINKSTER_VERIFY_WORK }}/update-proof/*.json
            ${{ env.DINKSTER_VERIFY_WORK }}/update-proof/*.png
            ${{ env.DINKSTER_VERIFY_WORK }}/update-proof/*.txt
          retention-days: 7
          if-no-files-found: ignore
