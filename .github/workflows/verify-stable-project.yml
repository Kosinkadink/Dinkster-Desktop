name: Published Stable project acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/verify-stable-project.yml'
      - '.github/workflows/verify-published-desktop.yml'
      - 'packages/e2e/scripts/verify-stable-project.mjs'

permissions:
  contents: read

jobs:
  stable-project:
    uses: ./.github/workflows/verify-published-desktop.yml
    with:
      source: 88f9e0bf4b9dd5a0281cf972ec261fa412620342
      release_tag: desktop-v0.2.5
      verification_source: ${{ github.event.pull_request.head.sha }}
      stable_project_only: true
