name: Windows installed updates

on:
  pull_request:
    paths:
      - '.github/workflows/windows-update.yml'
      - 'packages/desktop/**'
      - 'packages/e2e/scripts/verify-shell-update.mjs'
      - 'packages/e2e/scripts/advance-update-installer.ps1'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  DINKSTER_ACCELERATOR: cpu
  CUDA_VISIBLE_DEVICES: ''

jobs:
  fixtures:
    name: Build unsigned Windows update fixtures
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @dinkster/desktop prepare:tools
      - name: Package different installed and available versions
        run: |
          $old = '0.2.4'
          $new = '0.2.5'
          foreach ($version in @($old, $new, '0.2.4-rc.1', '0.2.6-rc.10')) {
            $output = Join-Path $env:RUNNER_TEMP "fixtures/$version"
            pnpm --filter @dinkster/desktop exec electron-builder --win nsis "--config.extraMetadata.version=$version" "--config.directories.output=$output" --publish never
            if ($LASTEXITCODE -ne 0) { throw "Packaging $version failed" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-update-fixtures
          path: |
            ${{ runner.temp }}/fixtures/*/*-Setup.exe
            ${{ runner.temp }}/fixtures/*/*.yml
            ${{ runner.temp }}/fixtures/*/*.blockmap
          if-no-files-found: error
          retention-days: 1

  installed:
    name: Windows installed update - ${{ matrix.scenario }}
    needs: fixtures
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [update, corruption, downgrade, rc-update, rc-downgrade, signature]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: windows-update-fixtures
          path: fixtures
      - name: Acquire the signed release for publisher refusal
        if: matrix.scenario == 'signature'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-v0.2.5-rc.1
          DESKTOP_SOURCE_COMMIT: 75655bc8130e71c7ee622e916dc4b482afd85b6e
          DINKSTER_VERIFY_WORK: ${{ runner.temp }}/published-update
        run: node packages/desktop/scripts/download-update-releases.mjs
      - name: Install and exercise the real updater
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          Get-ChildItem Env: | Where-Object { $_.Name -match 'TOKEN|SECRET|PASSWORD|CREDENTIAL|^GIT_' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $installed = switch ($env:SCENARIO) {
            'downgrade' { '0.2.5' }
            'rc-update' { '0.2.4-rc.1' }
            'rc-downgrade' { '0.2.6-rc.10' }
            default { '0.2.4' }
          }
          $available = switch ($env:SCENARIO) {
            'downgrade' { '0.2.4' }
            'rc-downgrade' { '0.2.4-rc.1' }
            { $_ -in @('rc-update', 'signature') } { '0.2.6-rc.10' }
            default { '0.2.5' }
          }
          $feed = Join-Path $env:RUNNER_TEMP feed
          New-Item -ItemType Directory $feed | Out-Null
          Copy-Item "fixtures/$available/*" $feed
          if ($env:SCENARIO -eq 'update') { Copy-Item 'fixtures/0.2.6-rc.10/*' $feed }
          if ($env:SCENARIO -eq 'rc-update') { Copy-Item 'fixtures/0.2.5/*' $feed }
          $destination = Join-Path $env:RUNNER_TEMP 'installed/Dinkster Desktop'
          if (Test-Path $destination) { throw 'Installation must be fresh' }
          $installer = Get-Item "fixtures/$installed/*-Setup.exe"
          if ($env:SCENARIO -eq 'signature') {
            $signed = Get-Content (Join-Path $env:RUNNER_TEMP published-update/releases.json) -Raw | ConvertFrom-Json
            $installer = Get-Item (Join-Path $signed.current.directory $signed.current.archive)
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -notmatch 'CN=Jedrzej Kosinski(,|$)') { throw 'Signed refusal control requires the valid timestamped published installer' }
          }
          $process = Start-Process $installer.FullName -ArgumentList @('/S', '/currentuser', '/NODESKTOPSHORTCUT', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $env:DINKSTER_UPDATE_OLD_EXECUTABLE = Join-Path $destination 'Dinkster Desktop.exe'
          if ($env:SCENARIO -eq 'signature') {
            $signature = Get-AuthenticodeSignature $env:DINKSTER_UPDATE_OLD_EXECUTABLE
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -notmatch 'CN=Jedrzej Kosinski(,|$)') { throw 'Installed executable signature invalid' }
            $unsigned = Get-Item (Join-Path $feed '*-Setup.exe')
            if ((Get-AuthenticodeSignature $unsigned.FullName).Status -ne 'NotSigned') { throw 'Refusal candidate must be unsigned' }
          }
          $env:DINKSTER_UPDATE_RELEASE = $feed
          $env:DINKSTER_UPDATE_EXPECTED_VERSION = $available
          $env:DINKSTER_UPDATE_PROOF_ROOT = Join-Path $env:RUNNER_TEMP 'update-proof'
          $env:DINKSTER_UPDATE_CORRUPT = if ($env:SCENARIO -eq 'corruption') { '1' } else { '0' }
          $env:DINKSTER_UPDATE_EXPECT_SIGNATURE_REFUSAL = if ($env:SCENARIO -eq 'signature') { '1' } else { '0' }
          $env:DINKSTER_UPDATE_EXPECT_UNAVAILABLE = if ($env:SCENARIO -in @('downgrade', 'rc-downgrade')) { '1' } else { '0' }
          node packages/e2e/scripts/verify-shell-update.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed update verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-${{ matrix.scenario }}
          path: ${{ runner.temp }}/update-proof/*
          retention-days: 7
          if-no-files-found: ignore
